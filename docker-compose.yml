services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-cost-tracker-postgres
    environment:
      POSTGRES_USER: llmcost
      POSTGRES_PASSWORD: llmcost
      POSTGRES_DB: llmcost
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmcost -d llmcost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llm-cost-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
